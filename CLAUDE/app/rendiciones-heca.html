/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k==="class") el.className = v;
    else if (k==="value") el.value = v;
    else el.setAttribute(k, v===true?"":v);

  for (const c of kids.flat()) if (c!=null && c!==false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const norm = s => (s??"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const tr = s => (s??"").toString().replace(/\s+/g," ").trim();
const raw = (list, v) => v ? (list.find(x => norm(x)===norm(v)) || null) : null;
const num = v => { if (v==null || v==="") return 0; if (typeof v==="number") return v;
  let s = String(v).replace(/[^\d,.\-]/g,""); if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g,"").replace(",","."); else s = s.replace(/[.,]/g,""); const n = parseFloat(s); return isNaN(n)?0:n; };

const lineTotal = l => num(l.neto)+num(l.iva)+num(l.exento)+num(l.otros);
const rendTotal = r => (r.lineas||[]).reduce((a,l)=>a+lineTotal(l),0);
const T = r => r.total ?? rendTotal(r);

  if (typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
  const s=String(v).trim(); let m;
  if ((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  if ((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) { const y=m[3].length===2?"20"+m[3]:m[3]; return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); }

/* ---------- state ---------- */
const S = { db:null, user:null, sample:null, assets:null, downloads:null, me:{id:null,canEdit:false}, ready:false,

const isAdm = () => !!S.me.canEdit && funcionDe(S.me.id)==="Administrador";
const isTes = () => !!S.me.canEdit && (isAdm() || funcionDe(S.me.id)==="Tesorero" || (!Object.keys(rolesMap()).length && !Object.values(S.personas).some(p=>p.funcion==="Tesorero")));

/* ---------- allocation: explicit links first, then FIFO ---------- */
function alloc(){
  const st = {}; S.rends.forEach(r=>st[r._id]={pagado:0, ultimo:""});
  const byP = {};
  for (const r of S.rends) (byP[norm(r.solicitante)] ||= {rends:[],pagos:[]}).rends.push(r);
  for (const p of S.pagos) (byP[norm(p.solicitante)] ||= {rends:[],pagos:[]}).pagos.push(p);
  const per = {};
  for (const [k,g] of Object.entries(byP)){
    const rs = g.rends.slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")||a.nro-b.nro);
    let pool = 0;
    for (const p of g.pagos.slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""))){
      let m = p.monto||0;
      for (const id of (p.rends||[])){ const r=rs.find(x=>x._id===id); if(!r) continue; const need=T(r)-st[id].pagado; const a=Math.max(0,Math.min(need,m)); st[id].pagado+=a; m-=a; if(a>0) st[id].ultimo=p.fecha||st[id].ultimo; }
      pool += m;
    }
    for (const r of rs){ const need=T(r)-st[r._id].pagado; if (need>0.5 && pool>0.5){ const a=Math.min(need,pool); st[r._id].pagado+=a; pool-=a; } }
    const rendido = rs.reduce((s,r)=>s+T(r),0), pagado = g.pagos.reduce((s,p)=>s+(p.monto||0),0);

    const falt=[]; for(let i=1;i<=max;i++) if(!nros.includes(i)) falt.push(i);
    per[k] = {nombre: (g.rends[0]||g.pagos[0]).solicitante, rendido, pagado, saldo: rendido-pagado, n: rs.length, max, falt,
      anticipos: g.pagos.filter(p=>p.tipo==="Anticipo").reduce((s,p)=>s+p.monto,0)};

async function prepImages(files, max){
  // Envía cada foto completa y, si hay cupo, recortes ampliados para que se lean las boletas chicas.
  const out=[]; const notes=[]; let n=0;
  const per = files.length*5<=max ? 4 : files.length*3<=max ? 2 : 0;
  for (let i=0;i<files.length && out.length<max;i++){
    out.push(files[i]); n++; notes.push(`Imagen ${n}: foto ${i+1} completa.`);
    if (!per) continue;
    try{
      const bmp = await createImageBitmap(files[i], {imageOrientation:"from-image"});
      const W=bmp.width, H=bmp.height, land=W>=H;
      const boxes = per===4 ? [[0,0],[1,0],[0,1],[1,1]].map(([cx,cy])=>[cx*W*0.45,cy*H*0.45,W*0.55,H*0.55])
                            : (land ? [[0,0,W*0.55,H],[W*0.45,0,W*0.55,H]] : [[0,0,W,H*0.55],[0,H*0.45,W,H*0.55]]);
      for (const [x,y,w,h] of boxes){
        if (out.length>=max) break;
        const c=document.createElement("canvas"); const sc=Math.min(1,2400/Math.max(w,h)); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
        c.getContext("2d").drawImage(bmp,x,y,w,h,0,0,c.width,c.height);
        const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.9)); if(!b) continue;
        out.push(b); n++; notes.push(`Imagen ${n}: acercamiento de una parte de la foto ${i+1} (los recortes se traslapan; un documento que aparece en varios recortes o en la foto completa es UN solo documento).`);
      }
      bmp.close?.();
    }catch(e){}
  }
  return {images:out, note:"Cómo vienen las imágenes:\n"+notes.join("\n")};
}
function buildPrompt(tileNote=""){
  return `Eres el asistente de tesorería de Heca Chile. Las imágenes son la foto de un formulario de RENDICIÓN DE GASTOS (código POE-GLO-FIN-003) y, a veces, fotos de las boletas o facturas que lo respaldan.

${tileNote}
El formulario tiene: FECHA, EMPRESA, Nº RENDICION, NOMBRE SOLICITANTE, un título tipo "FONDOS POR RENDIR ...", y tres tablas: COMPRAS C/FACTURAS (fecha, proveedor, factura, neto, IVA, total, detalle), COMPRAS C/BOLETAS (fecha, proveedor, boleta, monto, detalle) y TRANSFERENCIAS REALIZADAS (fecha, descripción, monto). Al final está el TOTAL RENDICION.

MUY IMPORTANTE: una misma foto puede contener VARIOS documentos (varias boletas, tickets, vouchers o facturas puestos uno al lado del otro o encima de una hoja). Antes de responder, recorre cada imagen completa, de arriba abajo y de izquierda a derecha, y haz un inventario de TODOS los documentos que aparecen, aunque estén cortados, chicos o girados. Cada boleta o factura distinta es un documento distinto, aunque sean del mismo comercio. Dos documentos son el mismo solo si coinciden número, fecha y monto.

Reglas:
- Si hay formulario: las líneas salen de las tablas del formulario (una línea por fila con datos). Usa los documentos del inventario para completar o corregir esas líneas (proveedor, RUT, número, neto/IVA). Si un documento de las fotos no está en el formulario, agrégalo como línea nueva y avísalo en "dudas". Si una fila del formulario no tiene documento en las fotos, déjala y avísalo en "dudas".
- Si no hay formulario: una línea por cada documento del inventario.
- Nunca dupliques un mismo documento.
- Montos en pesos chilenos, enteros. En Chile el punto separa miles: "70.389" = 70389.
- Fechas en formato YYYY-MM-DD (el formulario usa DD-MM-YYYY).
- tipo: "Factura" (tabla de facturas), "Boleta" (tabla de boletas), "Boleta de honorarios" o "Transferencia" (tabla de transferencias).
- Factura: neto e iva por separado, exento solo si la factura lo muestra. Boleta, honorarios y transferencia: el monto total va en "exento" y neto e iva quedan en 0.
- "detalle": el texto de la columna DETALLE o DESCRIPCIÓN tal como está escrito.
- "subcuenta": elige la que mejor calce de esta lista (copia el texto exacto): ${LISTS.sub.map(tr).join(" | ")}.
- "solicitante": elige de esta lista el nombre que calce con NOMBRE SOLICITANTE (texto exacto), o escribe el nombre leído si no está: ${SOL().map(tr).join(" | ")}.
- "empresa": una de: ${EMP.map(e=>e[0]).join(" | ")}.
- Si algo no se lee bien o no calza, completa tu mejor lectura y explícalo en "dudas" (frases cortas en español).

Responde SOLO con un JSON con esta forma ("documentos" es tu inventario: uno por cada documento distinto que viste en las fotos, sin contar el formulario):
{"documentos":[{"foto":1,"tipo":"Boleta","proveedor":"","numero":"","fecha":"2026-10-14","monto":70389}],
 "solicitante":"","nro":42,"fecha":"2026-10-14","empresa":"","fondo":"FONDOS POR RENDIR CDA","totalFormulario":70389,
 "lineas":[{"fecha":"2026-10-14","tipo":"Boleta","proveedor":"","rut":"","numero":"","neto":0,"iva":0,"exento":70389,"detalle":"","subcuenta":""}],
 "dudas":[]}`;
}
async function leer(){
  if (!S.sample || !S.imgLimit){ render(); return; }
  S.busy=true; S.readMsg=null; S.ctl=new AbortController(); const keepEid=S.draft?.eid; S.draft=null; render();

    const j = await S.sample.json(buildPrompt(prep.note), {images:prep.images, signal:S.ctl.signal, cache:false, modelTier:"complex"});
    const emp = EMP.find(e=>norm(e[0])===norm(j.empresa)) || EMP[1];
    const sol = (!isTes() && raw(SOL(), S.perfil?.nombre)) || raw(SOL(), j.solicitante) || tr(j.solicitante);
    S.draft = { eid:keepEid, solicitante:sol, nro: j.nro!=null? String(j.nro).replace(/\D/g,"") : "", fecha: parseDate(j.fecha)||today(), empresa:emp[0],
      fondo: tr(j.fondo), totalForm: j.totalFormulario!=null ? String(num(j.totalFormulario)) : "",
      dudas: Array.isArray(j.dudas)? j.dudas.map(String) : [],
      lineas: (Array.isArray(j.lineas)&&j.lineas.length? j.lineas : [{}]).map(l=>{
        const sub = raw(LISTS.sub, l.subcuenta) || "";
        const cue = sub ? (raw(LISTS.cue, SUB2CUE[tr(sub)]) || "") : "";
        return { fecha: parseDate(l.fecha)||parseDate(j.fecha)||"", tipo: TIPOS.find(t=>norm(t)===norm(l.tipo))||"Boleta",
          proveedor: tr(l.proveedor), rut: tr(l.rut), numero: tr(l.numero).replace(/[^\w\-\/]/g,""),
          neto: num(l.neto)||"", iva: num(l.iva)||"", exento: num(l.exento)||"", otros:"", detalle: tr(l.detalle), sub, cue, cc: emp[2] };
      })};
    if (S.photos.length>max) S.draft.dudas.push(`Se leyeron las primeras ${max} fotos; las demás se guardan como respaldo.`);
    if (Array.isArray(j.documentos)) S.draft.docsLeidos = j.documentos.length;
    if (!raw(SOL(), sol)) S.draft.dudas.push("El solicitante no está en la lista: elígelo antes de enviar.");
  }catch(e){
    const c = e?.code;
    if (c==="cancelled") S.readMsg=["info","Lectura detenida."];
    else if (c==="not_granted"||c==="sampling_disabled") S.readMsg=["warn","Para leer las fotos hay que aceptar el permiso que aparece al subirlas. Vuelve a intentarlo y elige Permitir."];
    else if (c==="rate_limited") S.readMsg=["warn","Se alcanzó el límite de lecturas por ahora. Intenta de nuevo en unos minutos."];
    else if (c==="image_rejected") S.readMsg=["bad","Una de las fotos no se pudo abrir. Prueba con otra foto en JPG."];
    else if (c==="invalid_json") S.readMsg=["bad","No se pudieron ordenar los datos de estas fotos. Saca fotos más nítidas, con el formulario completo, e intenta de nuevo."];
    else S.readMsg=["bad","No se pudo leer la rendición. Intenta de nuevo."];
  }finally{ S.busy=false; S.ctl=null; render(); }
}

  if (!S.me.id) { const e=new Error(); e.userMsg="No se pudo identificar tu cuenta. Abre la página con tu cuenta de Heca."; throw e; }
  const c = clean(d);
  const fotos = d.fotos ? [...d.fotos] : [];
  if (S.assets){ for (const p of S.photos){ try{ const r = await S.assets.upload(p.file, {type: p.file.type||"image/jpeg"}); fotos.push(r.id); }catch(e){} } }
  const eid = d.eid || uidKey(); const now=new Date().toISOString();
  const prev = S.myEnvios[eid];
  const item = {...c, fotos, total:rendTotal(c), creadoEn: prev?.creadoEn || now, editadoEn: now};
  const ref = S.db.doc("envios/"+S.me.id);
  const snap = await ref.get();
  if (snap.exists) await ref.update({items:{[eid]:item}}); else await ref.set({items:{[eid]:item}});
  S.myEnvios = {...S.myEnvios, [eid]:item};
  S.photos.forEach(p=>URL.revokeObjectURL(p.url)); S.photos=[]; S.draft=null;
  S.sendMsg=["ok",`Rendición Nº ${c.nro} enviada por ${clp(item.total)}. Tesorería la revisará; sigue su estado en "Mis rendiciones".`];
  if (!S.assets || fotos.length===0) S.sendMsg[1]+=" Las fotos no quedaron guardadas en esta vista: entrega el papel a tesorería.";
  render();
}

async function leerCartola(file){
  S.bankMsg=null;
  try{
    const wb = XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});
    let hi = rows.findIndex(r=>r.some(c=>/fecha/i.test(String(c)))); if (hi<0) hi=0;
    const headers = rows[hi].map(x=>String(x).trim());
    const map={}; for (const [k,re] of Object.entries(GUESS)){ map[k]=headers.findIndex((x,j)=>re.test(x) && !Object.values(map).includes(j)); }
    S.bankFile={name:file.name, headers, data:rows.slice(hi+1), map, banco:$("#banco-sel")?.value||"Banco Internacional HGI "};
  }catch(e){ S.bankMsg=["bad","No se pudo leer el archivo. Descárgalo del banco en formato Excel o CSV."]; S.bankFile=null; }

}

  S.ready=true; render();
  const rer = () => { if (busyEditing()) tabs(); else render(); };
  db.doc("envios/"+S.me.id).onSnapshot(s=>{ S.myEnvios=(s.exists&&s.data().items)||{}; rer(); },()=>{});
  db.doc("publico/personas").onSnapshot(s=>{ S.personasDoc=s.exists; S.personas=(s.exists&&s.data().personas)||{}; rer(); },()=>{});
  db.doc("estados/"+S.me.id).onSnapshot(s=>{ S.myEstados=(s.exists&&s.data().items)||{}; S.perfil=(s.exists&&s.data().perfil)||null; rer(); },()=>{});
  if (S.me.canEdit){
    db.doc("config/roles").onSnapshot(s=>{ S.config=(s.exists&&s.data())||{}; rer(); },()=>{});
    db.collection("envios").onSnapshot(s=>{ S.envios=s.docs.map(d=>({_id:d.id,...d.data()})); rer(); },()=>{});
    db.collection("estados").onSnapshot(s=>{ S.estados={}; s.docs.forEach(d=>S.estados[d.id]=d.data()); rer(); },()=>{});
    const fail = e => { S.loadErr = "No se pudo cargar el historial ("+(e?.code||"error")+"). Recarga la página."; render(); };
    db.collection("rendiciones").limit(1000).onSnapshot(s=>{ S.rends=s.docs.map(d=>({_id:d.id,...d.data()})); S.loaded.rends=true; rer(); },fail);
    db.collection("pagos").limit(1000).onSnapshot(s=>{ S.pagos=s.docs.map(d=>({_id:d.id,...d.data()})); S.loaded.pagos=true; rer(); },fail);
    db.collection("cartolas").onSnapshot(s=>{ S.cartolas=s.docs.map(d=>({_id:d.id,...d.data()})); rer(); },()=>{});
  }
})();
</script>
