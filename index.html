<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rendiciones Heca Chile</title>
    <script>
      // Aplica el tema antes de pintar para evitar un destello claro en modo oscuro (ver useTheme.ts).
      try {
        var t = localStorage.getItem('tema')
        var d = t === 'oscuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.bsTheme = d ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
